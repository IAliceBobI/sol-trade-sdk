[package]
name = "sol-trade-sdk"
version = "4.0.0"
edition = "2024"
authors = [
    "William <byteblock6@gmail.com>",
    "sgxiang <sgxiang@gmail.com>",
    "wei <1415121722@qq.com>",
]
repository = "https://github.com/0xfnzero/sol-trade-sdk"
description = "Rust SDK to interact with the dex trade Solana program."
license = "MIT"
keywords = ["solana", "memecoins", "pumpfun", "pumpswap", "raydium"]
readme = "README.md"


[workspace]
members = [
    "sol-trade-test-utils",
    "examples/pumpfun_buy_test",
    "examples/trading_client",
    "examples/shared_infrastructure",
    "examples/middleware_system",
    "examples/pumpfun_copy_trading",
    "examples/pumpfun_sniper_trading",
    "examples/pumpswap_trading",
    "examples/bonk_sniper_trading",
    "examples/bonk_copy_trading",
    "examples/raydium_cpmm_trading",
    "examples/raydium_amm_v4_trading",
    "examples/address_lookup",
    "examples/nonce_cache",
    "examples/pumpswap_direct_trading",
    "examples/pumpswap_direct_trading_new_pool",
    "examples/wsol_wrapper",
    "examples/seed_trading",
    "examples/cli_trading",
    "examples/gas_fee_strategy",
    "examples/meteora_damm_v2_direct_trading",
    "examples/transaction_callback",
    "examples/test_wsol_ata_config",
    "examples/raydium_amm_v4_find_pool_by_mint",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
perf-trace = []  # 性能追踪特性，生产环境应禁用以获得最佳性能

[dependencies]
solana-sdk = "3.0.0"
solana-client = "3.0.8"
solana-program = "3.0.0"
solana-rpc-client = "3.0.8"
solana-rpc-client-api = "3.0.8"
solana-transaction-status = "3"
solana-account-decoder = "3"
solana-hash = "4.0"
solana-entry = "3.0.8"
solana-rpc-client-nonce-utils = "3.0.8"
solana-perf = "3.0.8"
solana-metrics = "3.0.8"
solana-nonce = "3.0.0"
solana-address-lookup-table-interface = "3.0.0"
solana-compute-budget-interface = "3.0.0"
solana-commitment-config = { version = "3", features = ["serde"] }
solana-transaction-status-client-types = "3"

spl-token = "9.0.0"
spl-token-2022 = "10.0.0"
spl-associated-token-account = "8.0.0"
spl-token-metadata-interface = "0.8"
spl-token-2022-interface = "2"

solana-tls-utils = "3.0.8"

borsh = { version = "1.6", features = ["derive"] }
isahc = "1.7.2"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.134"
futures = "0.3.31"
futures-util = "0.3.31"
base64 = "0.22.1"
bs58 = "0.5.1"
rand = "0.9.2"
bincode = "1.3"
anyhow = "1.0.90"
reqwest = { version = "0.12.12", features = ["json", "multipart"] }
tokio = { version = "1.42.0" , features = ["full", "rt-multi-thread"]}
tonic = { version = "0.14.2", features = ["transport"] }
rustls = { version = "0.23.23", features = ["ring"] }
rustls-native-certs = "0.8.1"
tokio-rustls = "0.26.1"
core_affinity = "0.8"
log = "0.4.22"
chrono = "0.4.39"
regex = "1"
tracing = "0.1.41"
thiserror = "2.0"
async-trait = "0.1.86"
lazy_static = "1.5.0"
once_cell = "1.20.3"
prost = "0.14.1"
prost-types = "0.14.1"
num_enum = "0.7.3"
num-derive = "0.4.2"
num-traits = "0.2.19"
hex = "0.4.3"
bytemuck = { version = "1.4.0" }
arrayref = "0.3.6"
borsh-derive = "1.6"
indicatif = "0.18.0"
solana-system-interface = { version = "3.0", features = ["bincode"] }
fnv = "1.0.7"
dashmap = "6.1.0"
clru = "0.6"
smallvec = "1.15.1"
parking_lot = "0.12"
arc-swap = "1.7"
sha2 = "0.10"
tonic-prost = "0.14.2"
quinn = {version = "0.11", default-features = false, features = ["rustls"]}

# Raydium CLMM math dependencies (same as official)
# Note: uint crate uses cfg(feature = "enable-power") internally, but we don't need that feature
uint = { git = "https://github.com/raydium-io/parity-common", package = "uint" }

# Performance optimization dependencies
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
memmap2 = "0.9"
num_cpus = "1.16"
libc = "0.2"

[dev-dependencies]
sol-trade-test-utils = { path = "./sol-trade-test-utils" }
serial_test = "3.2.0"
dotenvy = "0.15"
tempfile = "3.14"

# 🚀 编译器优化配置 - 平衡性能与编译速度
[profile.release]
opt-level = 3              # 最高优化级别（不影响编译速度）
lto = "thin"               # 瘦LTO - 平衡性能与编译速度（比fat快5-10倍）
codegen-units = 16         # 16个代码生成单元 - 并行编译（比1快10倍）
panic = "abort"            # 恐慌即中止
overflow-checks = false    # 禁用溢出检查
debug = false              # 禁用调试信息
debug-assertions = false   # 禁用调试断言
rpath = false
strip = true               # 去除符号表
incremental = true         # 增量编译 - 大幅加速重新编译

[profile.dev]
overflow-checks = true     # 开发时启用溢出检查
opt-level = 0
debug = 1
codegen-units = 256 # 保持高并行度

# 🚀 性能关键依赖的特殊优化
[profile.release.package.solana-sdk]
opt-level = 3

[profile.release.package.bincode]
opt-level = 3

# Lint 配置
[lints.clippy]
# 允许 construct_uint! 宏触发的问题（来自第三方库）
reversed-empty-ranges = "allow"

# 在数学计算中允许使用 unwrap/expect（经过 checked_* 操作后的 unwrap 是合理的）
# 这些用于溢出检查，如果失败表示数据不一致，应该 panic
unwrap_in_result = "allow"
expect_used = "allow"

# 允许多参数函数（有些函数确实需要多个参数，重构反而降低可读性）
too_many_arguments = "allow"

# 允许复杂类型（一些复杂的泛型类型是必要的）
type_complexity = "allow"

# === 低优先级警告（不影响代码正确性） ===

# Default 实现建议 - 不是所有类型都需要 Default
# 注意: missing_trait_impl 在当前 Rust 版本不存在，改用 should_implement_trait
should_implement_trait = "allow"

# 文档相关 - 文档格式优化建议
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
doc_markdown = "allow"

# 代码风格 - 这些是风格偏好，不影响正确性
if_same_then_else = "allow"
needless_else = "allow"
let_and_return = "allow"
deprecated_cfg_attr = "allow"

# 循环和初始化优化建议
range_plus_one = "allow"
redundant_else = "allow"
uninit_assumed_init = "allow"
# 注意: late_initialization 和 init_numbered_ranges 在当前 Rust 版本不存在

# 命名和组织建议
module_name_repetitions = "allow"
single_match = "allow"
match_same_arms = "allow"

# 其他建议
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

# === 更多代码风格建议 ===

# 引用和切片建议
vec_box = "allow"
ptr_as_ptr = "allow"
ptr_cast_constness = "allow"

# 数学和计算建议
manual_div_ceil = "allow"

# 方法和trait建议
wrong_self_convention = "allow"

# 循环和迭代
needless_range_loop = "allow"
explicit_iter_loop = "allow"
explicit_into_iter_loop = "allow"

# 代码简洁性
redundant_pattern_matching = "allow"
# 注意: matched_wildcard 在当前 Rust 版本不存在
wildcard_enum_match_arm = "allow"

# 其他
blocks_in_conditions = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
if_not_else = "allow"
bool_comparison = "allow"

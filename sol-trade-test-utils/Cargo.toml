[package]
name = "sol-trade-test-utils"
version = "0.1.0"
edition = "2021"
description = "测试工具库 - 提供 Solana 交易测试的辅助功能"
license = "MIT"

[dependencies]
solana-sdk = "3.0.0"
solana-client = "3.0.8"
solana-rpc-client = "3.0.8"
spl-token = "9.0.0"
spl-associated-token-account = "8.0.0"
sol-trade-sdk = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
